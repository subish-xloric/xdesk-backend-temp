<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta http-equiv="X-UA-Compatible" content="IE=edge">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Document</title>
 <style>
     @media only screen
    and (max-device-width: 540px){
        .span{
            display: inline-block !important;
        }
        .span1{
            width: 100% !important;
        }
        .span2{
            display: none;
        }
    }
 </style>
</head>
<body>
	<div style="width: 100%;">
		<div style="background-color: #e5e5e5;padding: 8px; margin: 1%;">
			<!-- <div style="width: max-content;text-align: left;margin-bottom: 1%;">
				<span style="color: #f4a261;font-weight: bold;font-size: 21px;">Leave request</span>
			</div> -->
            <div style="background-color: #fffffc;  padding: 1%;border-radius: 3px;font-weight: bold;margin-bottom: 1%;">
                <span style="color: #f4a261;font-weight: bold;font-size: 21px;">{{subject}}</span>
            </div>
            <div style="width: 100%; display: inline-flex;">
                <div style="position: relative; width: 100%;background-color: #fffffc; padding: 8px;border-radius: 3px;text-align: left;color: #677473;">
                    <div>
                        <p>Dear {{emp_name}},
                            <br>
                            <br>
                            We regret to inform you that your employment with {{company_name}} shall officially get terminated on {{date}}. <br>
                            The reason for termination : " {{reason}} "</p>
                        <p></p>
                        <!-- <p><span style="font-weight: bold;color: #202525;">{{emp_name}}</span></p> -->
                    </div>
                </div>
            </div>
		</div>
	</div>
</body>
</html>
