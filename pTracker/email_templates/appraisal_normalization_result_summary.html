<!DOCTYPE html>
<html>
<head>
	<title>{{heading}}</title>
</head>
<body>
    <div style="width: 100%;">
		<div style="background-color: #e5e5e5;padding: 8px; margin: 1%;">
			<!-- <div style="width: max-content;text-align: left;margin-bottom: 1%;">
				<span style="color: #f4a261;font-weight: bold;font-size: 21px;">Leave request</span>
			</div> -->
            <div style="background-color: #fffffc;  padding: 1%;border-radius: 3px;font-weight: bold;margin-bottom: 1%;">
                <span style="color: #f4a261;font-weight: bold;font-size: 21px;">{{heading}}</span>
            </div>
            <div style="width: 100%; display: inline-flex;">
                <div style="position: relative; width: 100%;background-color: #fffffc; padding: 8px;border-radius: 3px;text-align: left;color: #677473;">
                    <div>
                        <ul>
                            {% for each in summary %}
                                <li>{{each}}</li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            </div>
		</div>
	</div>
</body>
</html>
